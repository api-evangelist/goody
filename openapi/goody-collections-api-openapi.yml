openapi: 3.2.0
info:
  title: Goody Collections API
  version: 1.0.0
  contact:
    name: Goody Support
    email: support@ongoody.com
servers:
- url: https://api.ongoody.com
  description: Production
- url: https://api.sandbox.ongoody.com
  description: Sandbox
tags:
- name: Collections
paths:
  /v1/collections:
    get:
      summary: List collections
      tags:
      - Collections
      security:
      - bearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page number for pagination (starts at 1)
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Number of collections to return per page (maximum 100)
        required: false
      - name: published
        in: query
        schema:
          type: boolean
        description: Return only published collections when true
        required: false
      - name: workspace_id
        in: query
        schema:
          type: string
          format: uuid
        description: Return only collections in this workspace. Must be a workspace the caller belongs to.
        required: false
      - name: exclude_archived
        in: query
        schema:
          type: boolean
        description: Exclude archived collections when true
        required: false
      responses:
        '200':
          description: Collections retrieved successfully
          content:
            application/json:
              examples:
                Collections retrieved successfully:
                  value:
                    data:
                    - id: 0d84aaff-5897-4dad-9730-7ffa3d22d8af
                      workspace_id: bb1e1eec-1639-4dd4-b59e-0556704e2c6c
                      title: Monetize Bleeding Edge Interfaces
                      is_published: false
                      published_price: null
                      products_count: null
                      product: null
                      published_version: null
                    - id: b0e0a375-1608-4a80-8742-ef119280bdfb
                      workspace_id: bb1e1eec-1639-4dd4-b59e-0556704e2c6c
                      title: Office Favorites
                      is_published: true
                      published_price: null
                      products_count: 2
                      product: null
                      published_version:
                        id: 5cff2c76-2e35-42c2-90eb-6d960e83533a
                        title: Office Favorites
                        subtitle: Curated treats for the whole team
                        multiple_select_mode: disabled
                        multiple_select_count: null
                        multiple_select_price: null
                        international_shipping_tier: standard
                        international_gift_cards_enabled: false
                        display_interface: single_page
                        header_image: null
                    list_meta:
                      total_count: 2
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
                  list_meta:
                    $ref: '#/components/schemas/ListMeta'
      operationId: getV1Collections
      x-operation-id-source: derived
  /v1/collections/{id}:
    get:
      summary: Retrieve a collection
      tags:
      - Collections
      security:
      - bearer: []
      parameters:
      - name: id
        in: path
        description: Collection ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Collection retrieved successfully
          content:
            application/json:
              examples:
                Collection retrieved successfully:
                  value:
                    id: b0e0a375-1608-4a80-8742-ef119280bdfb
                    workspace_id: bb1e1eec-1639-4dd4-b59e-0556704e2c6c
