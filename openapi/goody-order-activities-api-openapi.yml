openapi: 3.0.1
info:
  title: Goody Brands Order Activities API
  version: 1.0.0
  contact:
    name: Goody Support
    email: support@ongoody.com
servers:
- url: https://api.ongoody.com
  description: Production
- url: https://api.sandbox.ongoody.com
  description: Sandbox
tags:
- name: Order Activities
paths:
  /v1/order_activities:
    get:
      summary: List order activities
      tags:
      - Order Activities
      security:
      - bearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page for pagination, starting at 1
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Items per page for pagination
        required: false
      - name: after
        in: query
        schema:
          type: string
          format: date-time
          description: ISO 8601
          nullable: true
        description: Filter activities created at or after this timestamp (ISO 8601)
        required: false
      - name: before
        in: query
        schema:
          type: string
          format: date-time
          description: ISO 8601
          nullable: true
        description: Filter activities created at or before this timestamp (ISO 8601)
        required: false
      - name: statuses
        in: query
        schema:
          type: string
          nullable: true
        description: Comma-separated list of statuses to filter by (e.g. "created,opened,shipped")
        required: false
      responses:
        '200':
          description: Order activities retrieved
          content:
            application/json:
              examples:
