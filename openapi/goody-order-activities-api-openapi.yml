openapi: 3.2.0
info:
  title: Goody Order Activities API
  version: 1.0.0
  contact:
    name: Goody Support
    email: support@ongoody.com
servers:
- url: https://api.ongoody.com
  description: Production
- url: https://api.sandbox.ongoody.com
  description: Sandbox
tags:
- name: Order Activities
paths:
  /v1/order_activities:
    get:
      summary: List order activities
      tags:
      - Order Activities
      security:
      - bearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page for pagination, starting at 1
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Items per page for pagination
        required: false
      - name: after
        in: query
        schema:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601
        description: Filter activities created at or after this timestamp (ISO 8601)
        required: false
      - name: before
        in: query
        schema:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601
        description: Filter activities created at or before this timestamp (ISO 8601)
        required: false
      - name: statuses
        in: query
        schema:
          type:
          - string
          - 'null'
        description: Comma-separated list of statuses to filter by (e.g. "created,opened,shipped")
        required: false
      responses:
        '200':
          description: Order activities retrieved
          content:
            application/json:
              examples:
                Order activities retrieved:
                  value:
                    data:
                    - id: 8e78abef-249a-495e-8ddf-0843fe96627a
                      order_status: opened
                      created_at: '2026-07-28T20:20:13Z'
                      order:
                        id: eacd383b-aa90-4a28-a683-cb104625afb2
                        status: opened
                        individual_gift_link: https://gifts.ongoody.com/gift/X5RQOXFWRPDCGRLKVMJF6OFE
                        recipient_first_name: Recipient
                        recipient_last_name: Smith
                        recipient_email: null
                        card_id: 5825dda3-bf71-466b-bc08-f939ccd100be
                        message: Test Message
                        thank_you_note: null
                        view_count_recipient: 0
                        is_swapped: false
                        order_batch_id: 6622c37c-ae81-464b-8dfe-0ad6838004c2
                        expires_at: null
                        cart:
                          id: 9db7c144-d96d-4cab-87e5-fbab0a9f3aab
                          items:
                          - id: 5a5d350c-9be7-41e7-9aff-73a77690879d
