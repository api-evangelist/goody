openapi: 3.2.0
info:
  title: Goody Payment Methods API
  version: 1.0.0
  contact:
    name: Goody Support
    email: support@ongoody.com
servers:
- url: https://api.ongoody.com
  description: Production
- url: https://api.sandbox.ongoody.com
  description: Sandbox
tags:
- name: Payment Methods
paths:
  /v1/payment_methods:
    get:
      summary: List all payment methods
      tags:
      - Payment Methods
      security:
      - bearer: []
      responses:
        '200':
          description: Payment methods retrieved
          content:
            application/json:
              examples:
                Payment methods retrieved:
                  value:
                    data:
                    - id: 44b05451-c791-46a9-b0e4-0fcacf7cf44b
                      name: Visa 1234
                      cardholder_name: Card 1
                    - id: f29504ef-9079-49ef-b1dc-085b687b5dd8
                      name: Mastercard 5678
                      cardholder_name: Card 2
                    list_meta:
                      total_count: 2
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
                  list_meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          description: Failed to authorize
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    error: Unauthorized
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1PaymentMethods
      x-operation-id-source: derived
components:
  schemas:
    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        cardholder_name:
          type:
          - string
          - 'null'
          description: For payment methods with a cardholder name, returns the name on the card.
        balance:
          type:
          - integer
          - 'null'
          description: For payment methods with a balance, returns the available balance on the payment method.
      required:
      - id
      - name
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    ListMeta:
      type: object
      properties:
        total_count:
          type: integer
          description: The total number of items in this list.
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Your Goody API key.
x-provenance:
  method: harvested
  publisher: Goody
  source: https://assets.ongoody.com/static/web/goody-api-openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
