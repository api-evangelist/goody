info:
  title: Goody Workspaces API
  version: 1.0.0
  contact:
    name: Goody Support
    email: support@ongoody.com
servers:
- url: https://api.ongoody.com
  description: Production
- url: https://api.sandbox.ongoody.com
  description: Sandbox
tags:
- name: Workspaces
paths:
  /v1/workspaces:
    get:
      summary: List all workspaces
      tags:
      - Workspaces
      security:
      - bearer: []
      responses:
        '200':
          description: Workspaces retrieved
          content:
            application/json:
              examples:
                Workspaces retrieved:
                  value:
                    data:
                    - id: 40689dd7-8cbe-4a4c-82f7-dcbae14cc9c0
                      name: Workspace 1
                    - id: 0099a428-9264-4b69-96ca-b3a8e05ad6a8
                      name: Workspace 2
                    list_meta:
                      total_count: 2
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
                  list_meta:
                    $ref: '#/components/schemas/ListMeta'
      operationId: getV1Workspaces
      x-operation-id-source: derived
components:
  schemas:
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    ListMeta:
      type: object
      properties:
        total_count:
          type: integer
          description: The total number of items in this list.
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Your Goody API key.
