  /v1/products/{id}:
    get:
      summary: Retrieve a product
      tags:
      - Products
      security:
      - bearer: []
      parameters:
      - name: id
        in: path
        description: Product ID
        required: true
        schema:
          type: string
      - name: country_code
        in: query
        schema:
          type: string
          default: US
        description: Look up the product in a specific shipping country's catalog. Products are scoped to a country (default US), so a product that only ships elsewhere — e.g. an international gift card — 404s unless its country is passed here.
        required: false
      - name: use_custom_catalog
        in: query
        schema:
          type: boolean
        description: Limit to custom catalog only (for approved API partners)
        required: false
      responses:
        '200':
          description: Product retrieved
          content:
            application/json:
              examples:
                Product retrieved:
                  value:
                    id: 14eaedb5-b1cf-48c5-9408-948490dcc0ba
                    name: Six Cookies
                    brand:
                      id: 39873d74-8ed8-47a3-a5c3-65b7b916b36b
                      name: Ruby Emmerich
