openapi: 3.2.0
info:
  title: Goody Products API
  version: 1.0.0
  contact:
    name: Goody Support
    email: support@ongoody.com
servers:
- url: https://api.ongoody.com
  description: Production
- url: https://api.sandbox.ongoody.com
  description: Sandbox
tags:
- name: Products
paths:
  /v1/products:
    get:
      summary: List all active products
      tags:
      - Products
      security:
      - bearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page for pagination, starting at 1
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Items per page for pagination
        required: false
      - name: use_custom_catalog
        in: query
        schema:
          type: boolean
        description: Limit to custom catalog only (for approved API partners)
        required: false
      - name: country_code
        in: query
        schema:
          type: string
          default: US
        description: Filter by a specific shipping country code
        required: false
      - name: custom_catalog_show_inactive
        in: query
        schema:
          type: boolean
        description: Show inactive products in the custom catalog. Only for Commerce API customers with a custom catalog.
        required: false
      - name: brand_id
        in: query
        schema:
          type: string
        description: Limit to products from a specific brand
        required: false
      - name: category_id
        in: query
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: Limit to products in a category (see the categories endpoint). Accepts a single ID or an array of IDs.
        required: false
      - name: min_price
        in: query
        schema:
          type: integer
          minimum: 0
        description: Limit to products priced at or above this amount, in cents
        required: false
      - name: max_price
        in: query
        schema:
          type: integer
          minimum: 0
        description: Limit to products priced at or below this amount, in cents
        required: false
      - name: brand_values
        in: query
        schema:
          type: array
          items:
            type: string
        description: Limit to products whose brand has at least one of these brand values (e.g. Sustainable, Female Founded)
        required: false
      responses:
        '200':
          description: Products retrieved
          content:
            application/json:
              examples:
