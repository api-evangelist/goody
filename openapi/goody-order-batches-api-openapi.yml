      - first_name
      - last_name
      - email
    OrderBatchPriceCart:
      type: object
      description: Prices for a single recipient's cart in cents. This represents the price for each recipient in the order batch.
      properties:
        price_product:
          type: integer
          description: Total cost of products
        price_shipping:
          type: integer
          description: Total shipping cost
        price_processing_fee:
          type: integer
          description: Processing fee
        price_pre_tax:
          type: integer
          description: Subtotal before tax
        price_est_tax_low:
          type: integer
          description: Estimated tax (low-end, typically 0%)
        price_est_tax_high:
          type: integer
          description: Estimated tax (high-end, typically 10%)
        price_est_total_low:
          type: integer
          description: Estimated total (low-end tax, typically 0%)
        price_est_total_high:
          type: integer
          description: Estimated total (high-end tax, typically 10%)
      required:
      - price_product
      - price_shipping
      - price_processing_fee
      - price_pre_tax
      - price_est_tax_low
      - price_est_tax_high
      - price_est_total_low
      - price_est_total_high
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    OrderBatchSwap:
      type: string
      enum:
      - single
      - multiple
      - disabled
      description: What method to use to allow recipients to swap their gift. `single` (default) allows the recipient to swap the gift for one item, with hidden gift prices. `multiple` allows them to swap for multiple items up to the gift cost, with gift prices shown. `disabled` disables swapping on the gift. For gift collections (gift of choice), this must not be `disabled`.
    OrderBatchSendStatus:
      type: string
      enum:
      - pending
      - complete
      - failed
      - canceled
    CartSelection:
      type: object
      description: Product variant selections for a specific gift cart product.
      properties:
        id:
          type: string
          format: uuid
        cart_item_id:
          type: string
          format: uuid
          description: The cart item ID this selection belongs to. Match this with cart.items[].id.
        quantity_index:
          type: integer
          description: The index of this selection within multiple quantities of the same product. If a given cart product has multiple quantities, this will be 0 for the first unit, 1 for the second unit, etc.
        variants:
          type: array
          items:
            type: string
          description: The selected variants for this product selection and quantity index.
      required:
      - id
      - cart_item_id
      - quantity_index
      - variants
    RecipientInput:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type:
          - string
          - 'null'
          description: Optional. Phone number for text notifications. E164 format (e.g. +15552347890), US only.
        mailing_address:
          $ref: '#/components/schemas/MailingAddress'
          description: Optional mailing address to pre-populate into the order. This field is only available for approved API partners.
      required:
