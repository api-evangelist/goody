openapi: 3.2.0
info:
  title: Goody Me API
  version: 1.0.0
  contact:
    name: Goody Support
    email: support@ongoody.com
servers:
- url: https://api.ongoody.com
  description: Production
- url: https://api.sandbox.ongoody.com
  description: Sandbox
tags:
- name: Me
paths:
  /v1/me:
    get:
      summary: Retrieve current user
      tags:
      - Me
      security:
      - bearer: []
      responses:
        '200':
          description: Me retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Failed to authorize
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getV1Me
      x-operation-id-source: derived
components:
  schemas:
    Me:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
        public_app_id:
          type:
          - string
          - 'null'
    Error:
      type: object
      properties:
        error:
          type: string
      required:
      - error
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Your Goody API key.
